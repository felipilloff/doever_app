include: package:flutter_lints/flutter.yaml
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/*.g.dart'
    - test/migrations/generated/**
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    avoid_print: true
    unawaited_futures: true

plugins:
  riverpod_lint: 3.1.9
